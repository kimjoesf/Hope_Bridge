<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/panel :: layout('Profile & preferences', ~{::section})}">
<body>
<section class="page">
    <div class="page-head">
        <div class="profile-head">
            <span class="avatar avatar-lg" th:text="${fmt.initials(currentUser.fullName)}">OK</span>
            <div>
                <h1 th:text="${currentUser.fullName}">Omar Khaled</h1>
                <p>
                    <span th:text="${currentUser.role.label}">Donor</span><span class="dot-sep"></span>
                    <span th:text="'Member since ' + ${fmt.date(currentUser.createdAt)}">Member since</span>
                </p>
            </div>
        </div>
        <span th:replace="~{fragments/ui :: tier(${currentUser.donorTier})}"></span>
    </div>

    <div class="grid grid-2" style="align-items:start">
        <!-- ======================================================== details -->
        <div class="card">
            <div class="card-header"><h3>Your details</h3></div>
            <form method="post" action="/panel/profile" class="card-body form">
                <input th:replace="~{fragments/ui :: csrf}">
                <div class="field">
                    <label class="label" for="fullName">Full name</label>
                    <input class="input" id="fullName" name="fullName" required maxlength="120"
                           th:value="${old['fullName']} ?: ${currentUser.fullName}">
                </div>
                <div class="field">
                    <label class="label" for="email">Email</label>
                    <input class="input" id="email" th:value="${currentUser.email}" disabled>
                    <span class="hint">Your email is your sign-in, so it can't be changed here.</span>
                </div>
                <div class="field">
                    <label class="label" for="phone">Phone <span class="optional">(optional)</span></label>
                    <input class="input" id="phone" name="phone" type="tel" maxlength="30"
                           th:value="${old['phone']} ?: ${currentUser.phone}" placeholder="+20 100 000 0000">
                </div>
                <div><button type="submit" class="btn btn-primary">Save details</button></div>
            </form>
        </div>

        <!-- ============================== communication channel (Strategy) -->
        <div class="card">
            <div class="card-header">
                <h3>How should we reach you?</h3>
                <span class="badge badge-emerald plain" th:text="'Now: ' + ${currentUser.communicationStrategy.label}">Now: Email</span>
            </div>
            <form method="post" action="/panel/profile/channel" class="card-body form">
                <input th:replace="~{fragments/ui :: csrf}">
                <div class="choices">
                    <label class="choice" th:each="channel : ${channels}">
                        <input type="radio" name="channel" th:value="${channel.code}"
                               th:checked="${channel.code == currentUser.communicationStrategy.code}">
                        <span class="choice-body">
                            <span class="choice-icon"><svg class="icon"><use th:href="|#i-${fmt.icon(channel.code)}|"></use></svg></span>
                            <span>
                                <span class="choice-title" th:text="${channel.label}">Email</span>
                                <span class="choice-text" th:text="${channel.description}">Description</span>
                            </span>
                            <span class="choice-check"><svg class="icon"><use href="#i-check"></use></svg></span>
                        </span>
                    </label>
                </div>
                <div class="callout">
                    <svg class="icon"><use href="#i-sparkles"></use></svg>
                    <span>The switch is instant. We'll send a confirmation using your new channel, so you can see the difference in your inbox.</span>
                </div>
                <div><button type="submit" class="btn btn-primary">Update preference</button></div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
