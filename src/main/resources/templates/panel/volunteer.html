<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/panel :: layout('Skills & availability', ~{::section})}">
<body>
<section class="page">
    <div class="page-head">
        <div>
            <h1>Skills &amp; availability</h1>
            <p>Help us match you with the work you'll enjoy most, at times that suit you.</p>
        </div>
    </div>

    <form method="post" action="/panel/volunteer" class="grid grid-2" style="align-items:start">
        <input th:replace="~{fragments/ui :: csrf}">

        <div class="card">
            <div class="card-header"><h3>What can you bring?</h3><span class="badge plain" th:text="${#lists.size(selectedSkills)} + ' selected'">3 selected</span></div>
            <div class="card-body">
                <div class="pills">
                    <label class="pill" th:each="skill : ${skills}" th:title="${skill.description}">
                        <input type="checkbox" name="skillIds" th:value="${skill.id}" th:checked="${#lists.contains(selectedSkills, skill.id)}">
                        <span><svg class="icon"><use href="#i-sparkles"></use></svg><span th:text="${skill.name}">First aid</span></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3>When are you free?</h3></div>
            <div class="card-body choices">
                <label class="choice" th:each="slot : ${slots}">
                    <input type="checkbox" name="slotIds" th:value="${slot.id}" th:checked="${#lists.contains(selectedSlots, slot.id)}">
                    <span class="choice-body">
                        <span class="choice-icon"><svg class="icon"><use href="#i-clock"></use></svg></span>
                        <span><span class="choice-title" th:text="${slot.name}">Weekends</span>
                              <span class="choice-text" th:text="${slot.description}">Any time</span></span>
                        <span class="choice-check"><svg class="icon"><use href="#i-check"></use></svg></span>
                    </span>
                </label>
            </div>
            <div class="card-footer row-between">
                <span class="small muted">You can change this whenever your schedule does.</span>
                <button type="submit" class="btn btn-primary">Save profile</button>
            </div>
        </div>
    </form>
</section>
</body>
</html>
