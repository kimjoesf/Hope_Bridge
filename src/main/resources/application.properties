# settings
 

app.name=HopeBridge
server.port=8080

# Thymeleaf keeps parsed templates in memory when this is true.
views.cache=false

# SQL Server listens on TCP port 1434 on this machine.
# integratedSecurity=true logs in with your Windows account (the auth DLL is copied by Maven).
# To use a SQL login instead, set integratedSecurity=false and fill db.user / db.password.
db.url=jdbc:sqlserver://localhost:1433;databaseName=Hope-bridge;integratedSecurity=true;encrypt=true;trustServerCertificate=true
db.user=
db.password=
